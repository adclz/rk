<svg class="fig" viewBox="0 0 380 190" role="img" aria-label="An array subscript checked against its bounds: in bounds it stores, out of bounds it throws array index out of bounds"><rect class="l f" x="8" y="22" width="100" height="30" rx="3"/><text class="t" x="58" y="41" text-anchor="middle">a[i] := 0</text><path class="l" d="M108 37L136 37"/><path class="head" d="M136 37L130.6 39.6L130.6 34.4z"/><path class="l" d="M200 8L264 37L200 66L136 37z"/><text class="t" x="200" y="41" text-anchor="middle">1 ≤ i ≤ 3</text><path class="l" d="M264 37L300 37"/><path class="head" d="M300 37L294.6 39.6L294.6 34.4z"/><text x="270" y="28">yes</text><rect class="l" x="300" y="23" width="72" height="28" rx="3"/><text class="t" x="336" y="41" text-anchor="middle">store</text><path class="l" d="M200 66L200 104"/><path class="head" d="M200 104L197.4 98.6L202.6 98.6z"/><text x="208" y="90">no</text><rect class="k" x="70" y="104" width="260" height="34" rx="3"/><text class="p" x="200" y="125" text-anchor="middle">array index out of bounds</text><text x="200" y="166" text-anchor="middle">one exception, with its message</text></svg>
