# Nightly fuzzing of the compiler, the formatter, the editor's incremental
# path, the language server's requests and the values generated programs
# compute (crates/fuzz). Each target
# gets its own runner for 30 minutes, starting from the corpus the previous
# nights grew, and every crash is replayed by `repro`, which groups them by
# cause in the run summary. A crash fails the run; GitHub's notification is
# the alert.
#
# The targets are built by `cargo fuzz`, which is what instruments them for
# coverage: a plain `cargo build` links libFuzzer but gives it no feedback,
# and it then mutates a single newline. They are also built with ASan and
# debug assertions, so a `debug_assert!` is an oracle too.
name: fuzzing

on:
  schedule:
    # Daily at 2 AM UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_compiler, fuzz_formatter, fuzz_incremental, fuzz_semantics, fuzz_ide]
    env:
      CORPUS: crates/fuzz/corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # An ASan build of the workspace, wasmtime included, and a release
      # build of the corpus generator do not fit in the runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      # corpus_gen and repro build on the pinned toolchain; the fuzz targets
      # need nightly for the sanitizer flags. Nightly needs wasm32 too:
      # wasm_builtins_generated's build.rs compiles the builtins for it with
      # the cargo that runs it.
      - uses: ./.github/actions/rust-toolchain
      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown
      # One cache for every target, which share every dependency.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: fuzz
          save-if: ${{ matrix.target == 'fuzz_compiler' }}
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-fuzz
      # fuzz_semantics checks the optimized build too (RK_FUZZ_OPTIMIZE),
      # with the Binaryen the stdlib job pins.
      - name: Install Binaryen (for wasm-opt)
        if: matrix.target == 'fuzz_semantics'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_131/bin" >> "$GITHUB_PATH"
          echo "RK_FUZZ_OPTIMIZE=1" >> "$GITHUB_ENV"
      # libFuzzer keeps only the inputs that reached new code, so the corpus
      # carried from night to night is where the coverage is.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Every piece of ST the repository holds, including the programs the
      # codegen tests compile and run: the seeds closest to the code
      # generator's oracles. Numbered names, so the same seed overwrites
      # itself night after night.
      - name: Seed the corpus
        run: |
          cargo run --release -p rk-fuzz --bin corpus_gen -- \
            crates/tree-sitter/test/corpus stdlib crates/doc/examples docs skills src/tests \
            "$CORPUS"
      # The target triple is explicit: the cargo-fuzz binary installed above
      # is a static musl build, and would default to its own triple, where
      # ASan cannot link.
      - name: Build the target
        run: cargo +nightly fuzz build --fuzz-dir crates/fuzz --target x86_64-unknown-linux-gnu --debug-assertions ${{ matrix.target }}
      # Fork mode keeps going after a crash, so one bug does not end the
      # night; every crash lands in crates/fuzz/artifacts/<target>/. Wasm
      # execution is bounded by fuel, so a timeout is the compiler hanging.
      # The limit is generous: ASan, coverage and debug assertions make the
      # build many times slower, and a 22 KB stdlib file that takes 0.9 s
      # natively went past 10 s here, as a timeout that was no hang.
      #
      # The binary runs directly, not through `cargo fuzz run`: in fork mode
      # libFuzzer exits with its last job's status, 77 for a crash and 70
      # for a timeout. Those are findings, for the triage job to report;
      # cargo-fuzz would turn them into a failure of this one.
      - name: Fuzz for 30 minutes
        run: |
          artifacts="crates/fuzz/artifacts/${{ matrix.target }}"
          mkdir -p "$artifacts"
          status=0
          ./target/x86_64-unknown-linux-gnu/release/${{ matrix.target }} "$CORPUS" \
            -artifact_prefix="$artifacts/" \
            -max_total_time=1800 -fork=3 \
            -ignore_crashes=1 -ignore_timeouts=1 -ignore_ooms=1 \
            -timeout=60 -report_slow_units=60 -rss_limit_mb=4096 -detect_leaks=0 \
            -dict=crates/fuzz/st.dict || status=$?
          case "$status" in
            0|70|77) echo "libFuzzer exited $status; $(ls "$artifacts" | wc -l) file(s) in $artifacts" ;;
            *) echo "::error::the fuzzer itself failed (exit $status)"; exit "$status" ;;
          esac
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: crates/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  # One place that says what the night found: every crash file replayed on
  # the stable toolchain and grouped by the oracle or the panic site, with
  # the smallest input of each group named.
  triage:
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download crashes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-crashes-*
          path: crashes
      - name: Anything to triage?
        id: found
        run: |
          # A slow-unit file is libFuzzer's note that an input was slow, not
          # a failure.
          count=$(find crashes -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' \) 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          [ "$count" -gt 0 ] || echo "No crash tonight." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.found.outputs.count != '0'
        uses: ./.github/actions/rust-toolchain
      - if: steps.found.outputs.count != '0'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: fuzz
          save-if: false
      # A fuzz_semantics crash may be in the optimized build.
      - name: Install Binaryen (for wasm-opt)
        if: steps.found.outputs.count != '0'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz
          tar xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_131/bin" >> "$GITHUB_PATH"
      # Timeouts and OOMs are listed, not replayed: `repro` has no budget of
      # its own and would hang or exhaust this runner the same way.
      - name: Replay and group the crashes
        if: steps.found.outputs.count != '0'
        env:
          RK_FUZZ_OPTIMIZE: "1"
        run: |
          cargo build --release -p rk-fuzz --bin repro
          {
            echo '## Fuzzing crashes'
            # One replay per target: a fuzz_semantics crash file is the
            # generator's bytes, not ST, and `--generated` writes the
            # program again. `--isolate` runs each input in a child, so a
            # stack overflow is one crash in the list, not the end of it.
            # The full output, programs included, is in this step's log.
            for dir in crashes/fuzz-crashes-*; do
              target=${dir#crashes/fuzz-crashes-}
              mkdir -p "replay/$target"
              # The smallest crashes, which read best: a night re-finds the
              # same bugs thousands of times, and each replay is a process.
              total=$(find "$dir" -type f -name 'crash-*' | wc -l)
              find "$dir" -type f -name 'crash-*' -printf '%s %p\n' | sort -n | head -n 200 \
                | cut -d' ' -f2- | while read -r f; do cp "$f" "replay/$target/"; done \
                || true # `head` closing early makes `sort` exit on SIGPIPE, under pipefail
              [ -n "$(ls -A "replay/$target")" ] || continue
              # Each target's own oracle, so a crash is filed under it.
              case "$target" in
                fuzz_compiler) flag="--only pipeline" ;;
                fuzz_formatter) flag="--only format" ;;
                fuzz_incremental) flag="--only incremental" ;;
                fuzz_ide) flag="--only ide" ;;
                fuzz_semantics) flag="--generated" ;;
                *) flag="" ;;
              esac
              echo
              echo "### $target"
              echo
              echo "Replayed the $(ls "replay/$target" | wc -l) smallest of $total crash file(s)."
              echo
              echo '```'
              ./target/release/repro --isolate $flag "replay/$target" | tee /dev/stderr | sed -n '/^passed:\|input(s)/,$p' || true
              echo '```'
            done
            others=$(find crashes -type f \( -name 'timeout-*' -o -name 'oom-*' \))
            if [ -n "$others" ]; then
              echo
              echo 'Not replayed (timeouts, OOMs):'
              echo
              echo "$others" | sed 's/^/- /'
            fi
            echo
            echo 'Reproduce one with `cargo run -p rk-fuzz --bin repro -- <file>` (add `--generated` for fuzz_semantics).'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::the fuzzers found ${{ steps.found.outputs.count }} failing input(s); see the run summary"
          exit 1
