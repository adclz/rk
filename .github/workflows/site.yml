# The website: the generator verifies the sources against the compiler and
# writes what Zola renders; a Cloudflare Worker serves the result. Deploys
# from GitHub on every push to main.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
# Variable: SITE_URL, the public origin, which the generator bakes into
# llms.txt, the sitemap and the install line.
name: site

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "crates/**"
      - "stdlib/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Pinned, not tracking latest: a Zola release has already broken this
      # site once, when 0.23 removed shortcodes.
      - name: Install Zola
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: zola@0.23.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Refuses to write when a diagnostics example or a skill's example
      # disagrees with the compiler, so a broken page never reaches the site.
      - name: Verify the sources and write what Zola renders
        run: cargo run --release -p doc -- --base-url "${{ vars.SITE_URL }}"
      - name: Build the site
        working-directory: site
        run: zola build --base-url "${{ vars.SITE_URL }}"
      - name: Type-check and bundle the Worker
        working-directory: site
        run: npm ci --ignore-scripts && npm run check
      - name: Deploy
        working-directory: site
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
