name: Fuzzing

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/fuzz/**"
      - "crates/hir/**"
      - "crates/db/**"
      - "crates/ast/**"

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate corpus from tree-sitter tests
        run: |
          cargo run --release --manifest-path crates/fuzz/Cargo.toml --bin corpus_gen -- \
            crates/tree-sitter/test/corpus \
            crates/fuzz/corpus
        continue-on-error: true

      - name: Build fuzzer
        run: |
          cargo +nightly build --release --manifest-path crates/fuzz/Cargo.toml --bin fuzz_compiler

      - name: Run fuzzer (30 minutes)
        run: |
          mkdir -p fuzz_artifacts
          timeout 1800 ./target/release/fuzz_compiler crates/fuzz/corpus -max_total_time=1800 \
            || EXIT_CODE=$?
          echo "Fuzzer exit code: ${EXIT_CODE:-0}"
        continue-on-error: true

      - name: Collect crash artifacts
        if: always()
        run: |
          mkdir -p crash_artifacts
          if [ -f "crash-"* ]; then
            cp crash-* crash_artifacts/ 2>/dev/null || true
          fi
          if [ -f "oom-"* ]; then
            cp oom-* crash_artifacts/ 2>/dev/null || true
          fi
          if [ -f "leak-"* ]; then
            cp leak-* crash_artifacts/ 2>/dev/null || true
          fi
          if [ -f "slow-"* ]; then
            cp slow-* crash_artifacts/ 2>/dev/null || true
          fi
          ls -la crash_artifacts/ 2>/dev/null || echo "No crash artifacts found"

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-crashes
          path: crash_artifacts/
          if-no-files-found: ignore
          retention-days: 30

      - name: Check for crashes
        id: check_crashes
        if: always()
        run: |
          if [ -d crash_artifacts ] && [ -n "$(ls -A crash_artifacts)" ]; then
            echo "crashes_found=true" >> $GITHUB_OUTPUT
            echo "crash_count=$(ls -1 crash_artifacts | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "crashes_found=false" >> $GITHUB_OUTPUT
            echo "crash_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for crashes
        if: steps.check_crashes.outputs.crashes_found == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const crashDir = 'crash_artifacts';
            const crashes = fs.readdirSync(crashDir);

            let crashDetails = '';
            crashes.forEach(crash => {
              const crashPath = path.join(crashDir, crash);
              try {
                const content = fs.readFileSync(crashPath, 'utf8');
                crashDetails += '\n\n### ' + crash + '\n```\n' + content.substring(0, 500) + '\n```\n';
              } catch (e) {
                crashDetails += '\n\n### ' + crash + '\n(Binary file)\n';
              }
            });

            const body = '## Fuzzing Crash Report\n\n' +
              '**Date**: ' + new Date().toISOString() + '\n' +
              '**Run**: [#' + context.runNumber + '](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\n' +
              '### Summary\n' +
              'Found ' + crashes.length + ' crash(es) during fuzzing in IEC ST compiler\n\n' +
              '### Crashes Found\n' +
              crashDetails + '\n' +
              '### Artifacts\n' +
              'Crash artifacts are available in the [workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')\n\n' +
              '### How to Reproduce\n' +
              '```bash\n' +
              '# Download the crash file from artifacts\n' +
              './target/release/fuzz_compiler <crash_file>\n\n' +
              '# Or with backtrace\n' +
              'RUST_BACKTRACE=1 ./target/release/fuzz_compiler <crash_file>\n' +
              '```\n\n' +
              '### Next Steps\n' +
              '1. Download crash artifacts from workflow run\n' +
              '2. Reproduce locally\n' +
              '3. Minimize the input if needed\n' +
              '4. Add a regression test\n' +
              '5. Fix the underlying issue\n' +
              '6. Close this issue once resolved\n\n' +
              '/cc @' + context.actor;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🐛 Fuzzer crash detected - ' + new Date().toISOString(),
              body: body,
              labels: ['bug', 'fuzzing', 'high-priority']
            });

      - name: Print summary
        if: always()
        run: |
          echo "## Fuzzing Summary"
          echo ""
          echo "- **Fuzzer**: fuzz_compiler"
          echo "- **Duration**: 30 minutes"
          echo "- **Corpus size**: $(ls crates/fuzz/corpus/ | wc -l) test cases"
          if [ "${{ steps.check_crashes.outputs.crashes_found }}" = "true" ]; then
            echo "- **Result**: ⚠️ ${{ steps.check_crashes.outputs.crash_count }} crash(es) found"
            exit 1
          else
            echo "- **Result**: ✅ No crashes found"
          fi
