name: tree-sitter

on:
  push:
    branches: [main]
    paths:
      - "crates/tree-sitter/**"
      - ".github/workflows/tree-sitter.yml"
  pull_request:
    paths:
      - "crates/tree-sitter/**"
      - ".github/workflows/tree-sitter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      # Version floor from crates/tree-sitter/package.json ("^0.25.4"): the
      # CLI must match the generated parser's ABI. Built once, then cached.
      - name: Install the tree-sitter CLI
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: tree-sitter-cli@0.25.4
      - name: Test parser
        working-directory: crates/tree-sitter
        run: tree-sitter test
      # Needs libFuzzer, which the runner's clang provides.
      - name: Fuzz parser
        working-directory: crates/tree-sitter
        run: tree-sitter fuzz
