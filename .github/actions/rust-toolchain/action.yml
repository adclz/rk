# The toolchain rust-toolchain.toml pins, with the targets and components it
# lists, installed before cargo can try to do it mid-build.
#
# Explicit rather than a bare `rustup toolchain install`: that form needs
# rustup >= 1.28, and installing the file's targets up front keeps dozens of
# parallel rustc shims from racing to fetch them during the first build —
# which on Windows surfaced as "could not rename" component downloads.
name: Pinned Rust toolchain
description: Install the toolchain pinned by rust-toolchain.toml

runs:
  using: composite
  steps:
    - name: Install the toolchain pinned by rust-toolchain.toml
      shell: bash
      run: |
        TC=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$TC" --profile minimal \
          --target wasm32-unknown-unknown \
          --target x86_64-unknown-linux-gnu \
          --component clippy --component rustfmt
        # Proof the toolchain file resolves to what was just installed.
        rustup show active-toolchain
        cargo -vV
