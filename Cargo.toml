[workspace.package]
authors = ["Clauzel Adrien"]
license = "AGPL-3.0-only"
version = "0.1.0"
edition = "2024"

[workspace]
exclude = ["crates/wasm_builtins"]
members = [
    "crates/ast",
    "crates/db",
    "crates/hir",
    "crates/server",
    "crates/tree-sitter",
    "crates/memory_usage",
    "crates/ide_diagnostic",
    "crates/ide_proto",
    "crates/formatter",
    "crates/fuzz",
    "crates/wasm_codegen",
    "crates/wasm_builtins_generated",
    "crates/mir",
    "crates/debug_format",
    "crates/cli",
    "crates/benchmark",
    "crates/linter",
    "crates/doc",
    "crates/index",
    "crates/macros",
    "vscode/server",
]

[workspace.dependencies]
auto-lsp = { git = "https://github.com/adclz/auto-lsp", rev = "0a4060d39afcd06cf6df572d4913881da2338e79" }
auto-lsp-codegen = { git = "https://github.com/adclz/auto-lsp", rev = "0a4060d39afcd06cf6df572d4913881da2338e79" }
log = "0.4.27"
dashmap = "6.1.0"
rustc-hash = "2.1.0"
topiary-core = "0.7.3"
ast = { path = "crates/ast" }
tree-sitter-rk = { path = "crates/tree-sitter" }
server = { path = "crates/server" }
db = { path = "crates/db" }
memory_usage = { path = "crates/memory_usage" }
ide_diagnostic = { path = "crates/ide_diagnostic" }
ide_proto = { path = "crates/ide_proto" }
hir = { path = "crates/hir" }
wasm_codegen = { path = "crates/wasm_codegen" }
mir = { path = "crates/mir" }
debug_format = { path = "crates/debug_format" }
formatter = { path = "crates/formatter" }
linter = { path = "crates/linter" }
index = { path = "crates/index" }
macros = { path = "crates/macros" }
bon = "3.6.4"
phf = { version = "0.11.3", features = ["macros"] }
bitflags = "2.9.1"
auto_enums = "0.8.7"
camelpaste = "0.1.0"
fst = { version = "0.4.7", features = ["levenshtein"] }
rayon = "1.10.0"
dirs = "6.0.0"
compact_str = "0.9.0"
tracing = "0.1"
tracing-subscriber = "0.3"
get-size2 = "0.6.2"
ordermap = "0.5.8"
ariadne = "0.5.1"
time = { version = "0.3.41", features = ["macros", "parsing"] }
rstest = "0.26.1"
insta = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.109"
toml = "0.8"
indexmap = "2.13.0"
static_assertions = "1.1.0"
proc-macro2 = "1.0.66"
quote = "1.0.28"
syn = "2.0.18"
# salsa and tree-sitter versions must be kept in sync with auto-lsp's one
salsa = "0.26.0"
tree-sitter = "0.26.5"
tree-sitter-language = "0.1.7"
# cli dependencies
clap = { version = "4.5.54" }
yansi = { version = "1.0.1" }
notify = "8.1.0"
# benchmarks
divan = { package = "codspeed-divan-compat", version = "*" }
# backends
wasm-encoder = { version = "0.244.0", features = ["component-model"] }
wasmparser = "0.244.0"

[package]
name = "rk-tests"
version = "0.1.0"
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[profile.release]
opt-level = 3

# The binary that ships: `cargo build --profile dist -p rk`. 28 MiB against
# the 45 of `release`, for a five-minute link. Kept out of `release` on
# purpose: the site generator and the stdlib job rebuild with `--release`
# all day, and fat LTO over wasmtime is not a price to pay each time.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
auto-lsp = { workspace = true }
ast = { workspace = true }
db = { workspace = true }
hir = { workspace = true }
linter = { workspace = true }
ide_proto = { workspace = true }
mir = { workspace = true }
wasm_codegen = { workspace = true }
compact_str = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
insta = { workspace = true }
ariadne = { workspace = true }
ide_diagnostic = { workspace = true }
tree-sitter-rk = { workspace = true }
formatter = { workspace = true }
topiary-core = { workspace = true }
wasmparser = { workspace = true }
static_assertions = { workspace = true }
rk = { path = "crates/cli" }
tempfile = "3"
clap = { workspace = true }
serde_json = { workspace = true }
debug_format = { workspace = true }
wasmtime = "45.0.1"
wasm-encoder = { workspace = true }
anyhow = "1"
