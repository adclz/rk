[package]
name = "rk-tests"
authors = ["Clauzel Adrien"]
license = "AGPL-3.0-only"
description = ""
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = [
    "crates/ast",
    "crates/db",
    "crates/server",
    "crates/tree-sitter",
    "vscode/server",
]

[workspace.dependencies]
auto-lsp = { git = "https://github.com/adclz/auto-lsp", rev = "c151ffaf94e57d92168c175cc1c484409059caf5" }
auto-lsp-codegen = { git = "https://github.com/adclz/auto-lsp", rev = "c151ffaf94e57d92168c175cc1c484409059caf5" }
log = "0.4.27"
dashmap = "6.1.0"
rustc-hash = "2.1.0"
topiary-core = "0.6.1"
ast = { path = "crates/ast" }
tree-sitter-rk = { path = "crates/tree-sitter" }
server = { path = "crates/server" }
db = { path = "crates/db" }
bon = "3.6.4"
phf = { version = "0.11.3", features = ["macros"] }
bitflags = "2.9.1"
auto_enums = "0.8.7"