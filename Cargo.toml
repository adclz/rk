[workspace.package]
authors = ["Clauzel Adrien"]
license = "AGPL-3.0-only"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/ast",
    "crates/db",
    "crates/hir",
    "crates/server",
    "crates/tree-sitter",
    "crates/memory_usage",
    "crates/ide_diagnostic",
    "crates/ide_proto",
    "crates/formatter",
    "crates/fuzz",
    "crates/wasm_codegen",
    "crates/cli",
    "crates/benchmark",
    "crates/linter",
    "vscode/server",
]

[workspace.dependencies]
auto-lsp = { git = "https://github.com/adclz/auto-lsp", rev = "90ba73b0c3f3ae684d7c62c7b180f238d087051c" }
auto-lsp-codegen = { git = "https://github.com/adclz/auto-lsp", rev = "90ba73b0c3f3ae684d7c62c7b180f238d087051c" }
log = "0.4.27"
dashmap = "6.1.0"
rustc-hash = "2.1.0"
topiary-core = "0.7.3"
ast = { path = "crates/ast" }
tree-sitter-rk = { path = "crates/tree-sitter" }
server = { path = "crates/server" }
db = { path = "crates/db" }
memory_usage = { path = "crates/memory_usage" }
ide_diagnostic = { path = "crates/ide_diagnostic" }
ide_proto = { path = "crates/ide_proto" }
hir = { path = "crates/hir" }
wasm_codegen = { path = "crates/wasm_codegen" }
formatter = { path = "crates/formatter" }
linter = { path = "crates/linter" }
bon = "3.6.4"
phf = { version = "0.11.3", features = ["macros"] }
bitflags = "2.9.1"
auto_enums = "0.8.7"
camelpaste = "0.1.0"
fst = "0.4.7"
rayon = "1.10.0"
dirs = "6.0.0"
compact_str = "0.9.0"
tracing = "0.1"
tracing-subscriber = "0.3"
get-size2 = "0.6.2"
ordermap = "0.5.8"
ariadne = "0.5.1"
time = { version = "0.3.41", features = ["macros", "parsing"] }
rstest = "0.26.1"
insta = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.109"
toml = "0.8"
indexmap = "2.13.0"
# salsa and tree-sitter versions must be kept in sync with auto-lsp's one
salsa = "0.26.0"
tree-sitter = "0.26.5"
tree-sitter-language = "0.1.7"
# cli dependencies
clap = { version = "4.5.54" }
yansi = { version = "1.0.1" }
notify = "8.1.0"
# benchmarks
divan = "0.1"
# backends
wasm-encoder = "0.244.0"
wasmparser = "0.244.0"

[package]
name = "rk-tests"
version = "0.1.0"
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
publish = false

[profile.release]
opt-level = 3

[dependencies]
auto-lsp = { workspace = true }
ast = { workspace = true }
db = { workspace = true }
hir = { workspace = true }
linter = { workspace = true }
ide_proto = { workspace = true }
wasm_codegen = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
insta = { workspace = true }
ariadne = { workspace = true }
tree-sitter-rk = { workspace = true }
formatter = { workspace = true }
topiary-core = { workspace = true }
wasmparser = { workspace = true }