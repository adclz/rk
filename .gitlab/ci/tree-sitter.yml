tree-sitter:
  # node:lts (Bookworm) ships glibc 2.36; the prebuilt tree-sitter-cli
  # binary distributed via npm now requires glibc 2.39+. Trixie has 2.41.
  image: node:lts-trixie
  stage: test
  rules:
    - changes:
        - crates/tree-sitter/grammar.js
        - crates/tree-sitter/src/**
        - crates/tree-sitter/bindings/**
        - crates/tree-sitter/binding.gyp
        - .gitlab-ci.yml
        - .gitlab/ci/**
  before_script:
    - npm install -g tree-sitter-cli
  script:
    - cd crates/tree-sitter
    - tree-sitter test
    - tree-sitter fuzz
