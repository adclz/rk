stdlib-test:
  image: rust:latest
  stage: test
  rules:
    - changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "Cargo.lock"
        - "stdlib/**"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/**"
  before_script:
    - rustup target add wasm32-unknown-unknown
  cache:
    key: stdlib-${CI_COMMIT_REF_SLUG}
    paths:
      - target/
      - .cargo/
  script:
    - cargo build -p rk --release
    - cd stdlib
    - ../target/release/rk test
